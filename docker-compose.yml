# Camoufox Connector - Docker Compose Configuration
services:
  camoufox:
    build: .
    container_name: camoufox-connector
    ports:
      - "8080:8080"
      - "9222:9222"
    environment:
      - CAMOUFOX_MODE=single
      - CAMOUFOX_HEADLESS=true
      - CAMOUFOX_GEOIP=true
      - CAMOUFOX_HUMANIZE=true
      - CAMOUFOX_MCP_STATE_DIR=/var/lib/camoufox-connector/mcp-state
    restart: unless-stopped
    volumes:
      - mcp-state:/var/lib/camoufox-connector/mcp-state
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    shm_size: 2gb

  camoufox-pool:
    build: .
    container_name: camoufox-connector-pool
    profiles: [pool]
    network_mode: host
    environment:
      - CAMOUFOX_MODE=pool
      - CAMOUFOX_POOL_SIZE=5
      - CAMOUFOX_HEADLESS=true
      - CAMOUFOX_GEOIP=true
      - CAMOUFOX_HUMANIZE=true
      - CAMOUFOX_MCP_STATE_DIR=/var/lib/camoufox-connector/mcp-state
    restart: unless-stopped
    volumes:
      - mcp-state:/var/lib/camoufox-connector/mcp-state
    shm_size: 4gb

  camoufox-proxy:
    build: .
    container_name: camoufox-connector-proxy
    profiles: [proxy]
    ports:
      - "8080:8080"
      - "9222-9230:9222-9230"
    environment:
      - CAMOUFOX_MODE=pool
      - CAMOUFOX_POOL_SIZE=3
      - CAMOUFOX_HEADLESS=true
      - CAMOUFOX_PROXY=${PROXY_URL:-}
      - CAMOUFOX_MCP_STATE_DIR=/var/lib/camoufox-connector/mcp-state
    restart: unless-stopped
    volumes:
      - mcp-state:/var/lib/camoufox-connector/mcp-state
    shm_size: 4gb

volumes:
  mcp-state:

networks:
  default:
    name: camoufox-network
